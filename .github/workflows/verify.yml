name: Verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore foodstore-api/FoodstoreApi.slnx
      - run: dotnet build foodstore-api/FoodstoreApi.slnx --no-restore --configuration Release
      - run: dotnet test foodstore-api/FoodstoreApi.slnx --no-build --configuration Release

  frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [foodstore-admin, foodstore-store, foodstore-landingpage]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - working-directory: ${{ matrix.project }}
        run: npm ci
      - if: matrix.project == 'foodstore-admin'
        working-directory: foodstore-admin
        run: npx tsc --noEmit
      - if: matrix.project == 'foodstore-store'
        working-directory: foodstore-store
        run: npx svelte-check --tsconfig ./tsconfig.json
      - working-directory: ${{ matrix.project }}
        run: npm run build
